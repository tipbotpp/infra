name: tipbot

services:
  backend:
    build:
      context: /opt/apps/tipbot/backend
    container_name: tipbot-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - infra
      - monitoring

  worker:
    build:
      context: /opt/apps/tipbot/backend
    container_name: tipbot-worker
    command: arq src.worker.WorkerSettings
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      disable: true
    networks:
      - infra
      - monitoring

  ml:
    build:
      context: /opt/apps/tipbot/ml
    container_name: tipbot-ml
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - tipbot-ml-models:/app/models_cache
    networks:
      - infra
      - monitoring

networks:
  infra:
    external: true
  monitoring:
    external: true

volumes:
  tipbot-ml-models:
