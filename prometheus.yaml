global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "backend"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "tipbot-backend:8000"  

  - job_name: "ml"
    metrics_path: "/metrics"        
    static_configs:
      - targets:
          - "tipbot-ml:8000"       